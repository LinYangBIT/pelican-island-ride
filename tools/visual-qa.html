<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鹈鹕岛 · 视觉验收</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e9eee8;color:#1e4546;font:14px/1.5 system-ui,sans-serif}header{padding:14px 20px;background:#fdf9eb;border-bottom:1px solid #c7d3c6}h1{font-size:18px;margin:0 0 8px}p{margin:7px 0;color:#5e726d;font-size:12px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}fieldset{display:flex;gap:5px;align-items:center;border:0;margin:0;padding:0}legend{float:left;margin-right:7px;font-size:12px}button,select{font:inherit;border:1px solid #a9beb2;color:#234a47;background:#fffdf2;border-radius:6px;padding:6px 10px;cursor:pointer}button[aria-pressed=true]{background:#244c49;color:#fff8dc}label{display:flex;gap:5px;align-items:center}button:disabled,select:disabled{opacity:.6;cursor:wait}canvas{display:block;width:100%;height:calc(100dvh - 185px);min-height:340px;background:#c8e1d7}output{display:block;padding:10px 20px;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;background:#fdf9eb;border-top:1px solid #c7d3c6}.meta{margin:8px 0 0}#loading{color:#9a593c}@media(max-width:700px){header{padding:10px}.controls{gap:8px}canvas{height:calc(100dvh - 285px);min-height:350px}output{padding:10px;font-size:11px}}
  </style>
</head>
<body>
  <header>
    <h1>鹈鹕岛 · 固定视角验收</h1>
    <div class="controls">
      <fieldset><legend>场景</legend><button data-biome="0" aria-pressed="true">海岸</button><button data-biome="1" aria-pressed="false">雨林</button><button data-biome="2" aria-pressed="false">月夜</button></fieldset>
      <fieldset><legend>视角</legend><button data-view="menu" aria-pressed="true">角色近景</button><button data-view="playing" aria-pressed="false">正常骑行</button><button data-view="gliding" aria-pressed="false">张翼滑翔</button></fieldset>
      <label>绘制版本 <select id="version"><option value="current">新版</option><option value="baseline">原版</option></select></label>
      <label><input id="lighting" type="checkbox" checked>光照与反光</label>
      <label><input id="reduced" type="checkbox">轻量画面</label>
      <button id="motion" aria-pressed="false">播放动画</button>
      <button id="reset">固定 t=5</button>
      <button id="measure">采集 15 秒</button>
    </div>
    <p class="meta">可重复绘制夹具，不运行游戏模拟、不读写存档。固定时刻、相机、材质种子与分辨率；“光照与反光”切换新版渐变着色、投影与反光，几何及材质底色保持一致。</p>
    <p id="loading" role="status"></p>
  </header>
  <canvas id="fixtureCanvas" aria-label="固定场景画布"></canvas>
  <output id="metrics" aria-live="polite">等待采集。CPU 绘制提交耗时不等于 GPU 帧耗时；此工具不代表真实手机性能。</output>
  <script type="module" src="./visual-qa.js"></script>
</body>
</html>
